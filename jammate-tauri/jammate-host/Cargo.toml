[package]
name = "jammate-host"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15"
rack = { version = "0.4", features = ["cpal"] }
rustfft = "6"
ringbuf = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
atomic_float = "1"
log = "0.4"
anyhow = "1"
crossbeam-channel = "0.5"
env_logger = "0.11"
