[package]
name = "jammate-tauri-app"
version = "0.1.0"
description = "JamMate desktop app with VST/AU plugin hosting"
authors = ["JamMate"]
edition = "2021"

[lib]
name = "jammate_tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
jammate-host = { path = "../jammate-host" }
